<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rive Car</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    #rive-canvas {
      display: block;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <!-- WORKINGBASE -->
  <canvas
    id="rive-canvas"
    width="190"
    height="240">
  </canvas>

  <script src="https://unpkg.com/@rive-app/canvas@2.24.0"></script>
  <script>
    (function () {
      const canvas = document.getElementById("rive-canvas");
      if (!canvas || !window.rive) return;

      const r = new rive.Rive({
        src: "https://varrgo.github.io/siteanim/cursor_-_brown_v3c.riv",
        canvas: canvas,
        autoplay: true,
        stateMachines: "State Machine 1",
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
        },
      });
    })();
  </script>
</body>
</html>
