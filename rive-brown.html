<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rive Car</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    #rive-wrapper {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    #rive-canvas {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="rive-wrapper">
    <canvas id="rive-canvas"></canvas>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.24.0"></script>
  <script>
    (function () {
      const canvas = document.getElementById("rive-canvas");
      if (!canvas || !window.rive) return;

      const r = new rive.Rive({
        src: "https://varrgo.github.io/siteanim/cursor_-_brown_v3c.riv",
        canvas: canvas,
        autoplay: true,
        stateMachines: "State Machine 1",
        onLoad: () => {
          resizeToCanvas();
        },
      });

      function resizeToCanvas() {
        if (!canvas || !r) return;

        // How big is the canvas element *visually* (inside the iframe)?
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        // Set internal drawing buffer to match visible size
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        r.resizeDrawingSurfaceToCanvas();
      }

      // Recalculate if iframe size changes
      window.addEventListener("resize", resizeToCanvas);
    })();
  </script>
</body>
</html>
